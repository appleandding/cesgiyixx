<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>drizzle · 激活码分发控制台</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
:root {
  --bg-base: #F5F7FA;
  --glass-bg: rgba(255, 255, 255, 0.78);
  --glass-border: rgba(255, 255, 255, 0.95);
  --glass-subtle: rgba(240, 244, 248, 0.85);
  --glass-shine: inset 0 1px 1.5px rgba(255, 255, 255, 0.95), inset 0 -0.5px 1px rgba(255, 255, 255, 0.25);
  --text-main: #334155;
  --text-muted: #64748B;
}
body {
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  position: relative;
}
.dot-pattern {
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#CBD5E1 1.2px, transparent 1.2px);
  background-size: 20px 20px;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}
.container {
  width: 100%;
  max-width: 400px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 26px;
  box-shadow: 0 12px 36px rgba(51, 65, 85, 0.08), var(--glass-shine);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.header-box {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.app-badge {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--text-muted);
  background: var(--glass-subtle);
  border: 1px solid var(--glass-border);
  padding: 3px 12px;
  border-radius: 14px;
}
.app-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-main);
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat-box {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--glass-shine);
}
.stat-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
}
.stat-num {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
}
.draw-stage {
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(240,244,248,0.7));
  border: 1.5px dashed rgba(148, 163, 184, 0.6);
  border-radius: 22px;
  padding: 24px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
}
.code-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #0f172a;
  user-select: all;
  min-height: 32px;
  display: flex;
  align-items: center;
}
.code-placeholder {
  color: #94a3b8;
  font-size: 13px;
  letter-spacing: 0;
  font-family: inherit;
  font-weight: 600;
}
.btn-primary {
  width: 100%;
  padding: 15px;
  border-radius: 20px;
  background: #1e293b;
  color: #FFFFFF;
  border: none;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .15s ease;
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-copy {
  padding: 8px 18px;
  border-radius: 14px;
  background: #FFFFFF;
  border: 1px solid var(--glass-border);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--text-main);
  box-shadow: var(--glass-shine);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-copy:active { transform: scale(0.95); }

.history-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.history-title {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
}
.history-item {
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}
.history-code {
  font-family: monospace;
  font-weight: 700;
  color: var(--text-main);
}
.history-time {
  font-size: 9.5px;
  color: var(--text-muted);
}
.hidden { display: none !important; }
</style>
</head>

<body>
<div class="dot-pattern"></div>

<div class="container">
  <div class="glass-card">
    <div class="header-box">
      <span class="app-badge">DRIZZLE ADMIN</span>
      <div class="app-title">激活码分发控制台</div>
      <div style="font-size:10.5px; color:var(--text-muted);">已连接云端数据库 · 实时防重复抽取</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-label">剩余未发卡密</span>
        <span class="stat-num" id="statRemaining">查询中...</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">群友已注册</span>
        <span class="stat-num" id="statUsed">查询中...</span>
      </div>
    </div>
  </div>

  <div class="glass-card">
    <div class="draw-stage">
      <div class="code-display" id="displayCodeBox">
        <span class="code-placeholder">点击下方按钮抽取未注册激活码</span>
      </div>
      <button class="btn-copy hidden" id="copyBtn" onclick="copyCurrentCode()">
        <span>复制激活码发给群友</span>
      </button>
    </div>

    <button class="btn-primary" id="drawBtn" onclick="drawSingleCode()">
      <span> 抽取 1 个新激活码</span>
    </button>
  </div>

  <div class="glass-card">
    <div class="history-section">
      <div class="history-title">
        <span>本次发放记录</span>
        <span id="sessionCount">0 个</span>
      </div>
      <div class="history-list" id="historyList">
        <div style="text-align:center; padding:12px; font-size:11px; color:#94a3b8;">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 经过截图严格校对的正确凭证 ====================
const SUPABASE_URL = "https://flqnyfpdmsulxjgudzrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_MTsNbs5-vUJXmlccP3KTTQ_64sHwlG";

let currentDrawnCode = "";
let sessionHistory = [];

// 纯原生 REST 请求函数（不依赖任何第三方 CDN 库，彻底消除加载白屏）
async function supabaseFetch(endpoint, options = {}) {
  const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };
  return fetch(url, { ...options, headers });
}

// 1. 初始化并获取云端实时统计
async function refreshStats() {
  const statRem = document.getElementById('statRemaining');
  const statUsed = document.getElementById('statUsed');

  try {
    // 查询未发放且未使用的总数
    const resp1 = await supabaseFetch('activation_codes?is_used=eq.false&select=id', {
      headers: { 'Range-Unit': 'items', 'Prefer': 'count=exact' }
    });
    
    // 查询已被注册使用的总数
    const resp2 = await supabaseFetch('activation_codes?is_used=eq.true&select=id', {
      headers: { 'Range-Unit': 'items', 'Prefer': 'count=exact' }
    });

    if (!resp1.ok || !resp2.ok) {
      const errText = await resp1.text();
      statRem.innerHTML = `<span style="font-size:11px; color:#ef4444;">连接被拒: ${resp1.status}</span>`;
      return;
    }

    // 从 Content-Range 头读取精确数量 (例: 0-0/2150)
    const range1 = resp1.headers.get('content-range');
    const range2 = resp2.headers.get('content-range');
    
    statRem.innerText = range1 ? range1.split('/')[1] : "0";
    statUsed.innerText = range2 ? range2.split('/')[1] : "0";

  } catch (e) {
    statRem.innerHTML = `<span style="font-size:11px; color:#ef4444;">连接超时(请开VPN)</span>`;
    statUsed.innerText = "--";
  }
}

// 2. 抽取 1 个激活码（核心防重复逻辑：取出即标记已使用）
async function drawSingleCode() {
  const drawBtn = document.getElementById('drawBtn');
  const codeBox = document.getElementById('displayCodeBox');
  const copyBtn = document.getElementById('copyBtn');

  drawBtn.disabled = true;
  drawBtn.innerText = "正在从云端调取…";

  try {
    // 1. 抓取 1 个未被使用的激活码
    const getResp = await supabaseFetch('activation_codes?is_used=eq.false&limit=1&select=id,code');
    if (!getResp.ok) throw new Error('网络请求异常 ' + getResp.status);
    
    const list = await getResp.json();
    if (!list || list.length === 0) {
      alert('激活码已被抽光！');
      codeBox.innerHTML = '<span class="code-placeholder" style="color:#ef4444;">暂无可用激活码</span>';
      copyBtn.classList.add('hidden');
      return;
    }

    const item = list[0];

    // 2. 关键防重复：在云端把此卡密锁死（标记为已取走，其他管理员绝不可能抽到重复码）
    await supabaseFetch(`activation_codes?id=eq.${item.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ is_used: true, used_by_qq: '管理员发放' })
    });

    currentDrawnCode = item.code;
    codeBox.innerText = item.code;
    copyBtn.classList.remove('hidden');

    addHistory(item.code);
    refreshStats();

  } catch (err) {
    alert('抽取失败：手机无法连接至海外服务器，请让管理员打开 VPN/加速器！');
  } finally {
    drawBtn.disabled = false;
    drawBtn.innerText = "抽取 1 个新激活码";
  }
}

// 3. 一键复制卡密
function copyCurrentCode() {
  if (!currentDrawnCode) return;
  navigator.clipboard.writeText(currentDrawnCode).then(() => {
    alert(`激活码 [ ${currentDrawnCode} ] 已复制成功！\n直接发给群友即可~`);
  }).catch(() => {
    prompt('长按复制激活码：', currentDrawnCode);
  });
}

// 4. 发放历史展示
function addHistory(code) {
  const time = new Date().toLocaleTimeString();
  sessionHistory.unshift({ code, time });
  document.getElementById('sessionCount').innerText = `${sessionHistory.length} 个`;

  const list = document.getElementById('historyList');
  list.innerHTML = sessionHistory.map(item => `
    <div class="history-item">
      <span class="history-code">${item.code}</span>
      <span class="history-time">${item.time}</span>
    </div>
  `).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  refreshStats();
});
</script>
</body>
</html>
